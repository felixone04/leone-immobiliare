name: leone_immobiliare
description: "Leone Immobiliare - sito vetrina e area riservata in Flutter, utilizzabile offline in locale"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  go_router: ^18.0.2
  sembast: ^3.8.11
  sembast_web: ^2.4.6
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  url_launcher: ^6.3.3
  flutter_svg: ^2.3.0
  intl: ^0.20.3
  cryptography: ^2.9.0
  image: ^4.10.1
  file_picker: ^13.1.0
  web: ^1.1.1
  pdf: ^3.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/foto/
    - assets/

  # Caratteri inclusi nell'app (funzionano anche senza internet):
  # Inter per i testi, Arimo (metriche di Arial, come "Leone" nel logo) per i titoli,
  # Jost per le etichette in maiuscolo (come "IMMOBILIARE" nel logo).
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-400.ttf
          weight: 400
        - asset: assets/fonts/Inter-500.ttf
          weight: 500
        - asset: assets/fonts/Inter-600.ttf
          weight: 600
        - asset: assets/fonts/Inter-700.ttf
          weight: 700
        - asset: assets/fonts/Inter-800.ttf
          weight: 800
    - family: Arial
      fonts:
        - asset: assets/fonts/Arimo-700.ttf
          weight: 700
    - family: Jost
      fonts:
        - asset: assets/fonts/Jost-400.ttf
          weight: 400
        - asset: assets/fonts/Jost-500.ttf
          weight: 500
        - asset: assets/fonts/Jost-600.ttf
          weight: 600
