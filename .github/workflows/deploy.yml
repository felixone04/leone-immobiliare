# Ricompila il sito e lo pubblica su GitHub Pages a ogni push su master.
name: Pubblica sito

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true

      - run: flutter pub get

      - run: flutter analyze

      # Il sito sta in /<nome-repository>/, non nella radice del dominio.
      # Caratteri e motore grafico inclusi nel sito: nessuna dipendenza da CDN esterni.
      - run: flutter build web --release --no-web-resources-cdn --base-href "/${{ github.event.repository.name }}/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
